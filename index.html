<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnyNet Announcement</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#announcement {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: hideAfter15s 1s linear 15s forwards;
}

#announcement img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

@keyframes hideAfter15s {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
</style>
</head>

<body>

<div id="announcement">
  <img src="AnyNet.jpg" alt="AnyNet Announcement">
</div>

<script>
setTimeout(function () {
  document.getElementById("announcement").style.display = "none";
}, 15000);
</script>

</body>
</html>
